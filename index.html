<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Special Coupons</title>
<style>
  :root {
    --bg: #f4f6f9;
    --card: #ffffff;
    --text: #222222;
    --muted: #666666;
    --primary: #1677ff;
    --danger: #ff4d4f;
    --border: #d9dfe6;
  }
  * {
    box-sizing: border-box;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Hiragino Sans", "Yu Gothic", "Noto Sans CJK JP", "Noto Sans CJK TC", "Noto Sans CJK KR", sans-serif;
    background-color: var(--bg);
    margin: 0;
    padding: 14px 14px 44px;
    color: var(--text);
  }
  .container {
    max-width: 960px;
    margin: 0 auto;
  }

  /* 言語切り替えバー */
  .lang-bar {
    display: flex;
    justify-content: flex-end;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 10px;
  }
  .lang-btn {
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text);
    padding: 6px 11px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
  }
  .lang-btn.active {
    background: #1f2937;
    color: #fff;
    border-color: #1f2937;
  }

  .header {
    text-align: center;
    margin: 4px auto 18px;
    max-width: 780px;
  }
  .header h1 {
    font-size: 22px;
    margin: 0 0 6px;
  }
  .header p {
    font-size: 13px;
    color: var(--muted);
    margin: 0;
    line-height: 1.5;
  }
  .status-bar {
    display: inline-block;
    margin-top: 10px;
    font-size: 12px;
    padding: 5px 12px;
    border-radius: 999px;
    background: #e9ecef;
    color: #495057;
  }
  .status-bar.unlocked {
    background: #d4edda;
    color: #155724;
    font-weight: bold;
  }

  /* 絞り込み・GPSコントロールパネル */
  .filter-panel {
    background: var(--card);
    border-radius: 14px;
    padding: 14px 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    margin-bottom: 20px;
  }
  .filter-group {
    margin-bottom: 12px;
  }
  .filter-group:last-child {
    margin-bottom: 0;
  }
  .filter-label {
    font-size: 12px;
    font-weight: bold;
    color: var(--muted);
    margin-bottom: 6px;
    display: block;
  }
  .chip-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  .chip-btn {
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text);
    padding: 7px 13px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.15s;
  }
  .chip-btn:hover {
    border-color: var(--primary);
    color: var(--primary);
  }
  .chip-btn.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }
  .gps-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    padding-top: 10px;
    border-top: 1px solid #eef1f5;
  }
  .gps-btn {
    background: #0f766e;
    color: #fff;
    border: none;
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
  }
  .gps-btn:hover {
    opacity: 0.92;
  }
  .gps-reset-btn {
    background: #eef1f5;
    color: #333;
    border: none;
    padding: 8px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
  }
  .gps-status {
    font-size: 12px;
    color: var(--muted);
  }

  /* クーポン一覧グリッド */
  .coupon-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(275px, 1fr));
    gap: 16px;
  }
  .coupon-card {
    background: var(--card);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 3px 10px rgba(0,0,0,0.07);
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    display: flex;
    flex-direction: column;
  }
  .coupon-card:hover {
    box-shadow: 0 6px 16px rgba(0,0,0,0.11);
  }
  .coupon-card:active {
    transform: scale(0.98);
  }
  .coupon-card img {
    width: 100%;
    height: 160px;
    object-fit: cover;
    display: block;
    background: #e9ecef;
  }
  .coupon-info {
    padding: 14px 16px 16px;
    flex: 1;
  }
  .meta-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 8px;
  }
  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: bold;
    padding: 3px 8px;
    border-radius: 5px;
  }
  .badge-available {
    background: var(--danger);
    color: #fff;
  }
  .badge-used {
    background: #8c8c8c;
    color: #fff;
  }
  .badge-cat {
    background: #eef4ff;
    color: var(--primary);
  }
  .badge-area {
    background: #f0fdf4;
    color: #15803d;
  }
  .badge-dist {
    background: #fff7ed;
    color: #c2410c;
  }
  .coupon-title {
    font-size: 16px;
    font-weight: bold;
    margin: 0 0 6px;
    line-height: 1.4;
  }
  .coupon-desc {
    font-size: 13px;
    color: var(--muted);
    margin: 0;
    line-height: 1.5;
  }
  .empty-msg {
    grid-column: 1 / -1;
    text-align: center;
    padding: 34px 16px;
    background: var(--card);
    border-radius: 12px;
    color: var(--muted);
    font-size: 14px;
  }

  /* モーダル */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    justify-content: center;
    align-items: center;
    z-index: 1000;
    padding: 16px;
  }
  .modal-box {
    background: var(--card);
    border-radius: 16px;
    width: 100%;
    max-width: 420px;
    padding: 24px 20px;
    text-align: center;
    position: relative;
    box-shadow: 0 12px 30px rgba(0,0,0,0.22);
    max-height: 90vh;
    overflow-y: auto;
  }
  .close-btn {
    position: absolute;
    top: 10px;
    right: 14px;
    font-size: 26px;
    line-height: 1;
    color: #888;
    cursor: pointer;
    border: none;
    background: none;
  }
  .pw-input {
    width: 84%;
    padding: 11px;
    font-size: 16px;
    border: 2px solid #d9d9d9;
    border-radius: 8px;
    margin: 12px 0;
    text-align: center;
  }
  .pw-input:focus {
    outline: none;
    border-color: var(--primary);
  }
  .btn {
    background: var(--primary);
    color: #fff;
    border: none;
    padding: 12px 18px;
    font-size: 14px;
    font-weight: bold;
    border-radius: 8px;
    cursor: pointer;
    width: 90%;
  }
  .btn:hover {
    opacity: 0.93;
  }
  .btn-use {
    background: var(--danger);
    margin-top: 16px;
  }
  .btn-used {
    background: #bfbfbf;
    cursor: not-allowed;
    margin-top: 16px;
  }
  .error-msg {
    color: #cf1322;
    font-size: 13px;
    margin-top: 8px;
    display: none;
  }
  .detail-img {
    width: 100%;
    height: 155px;
    object-fit: cover;
    border-radius: 10px;
    margin-bottom: 12px;
    background: #e9ecef;
  }
  .detail-terms {
    background: #f6f7f9;
    padding: 11px 12px;
    border-radius: 8px;
    font-size: 12px;
    color: #555;
    text-align: left;
    margin-top: 12px;
    white-space: pre-line;
    line-height: 1.6;
  }
</style>
</head>

<div class="container">

    <button type="button" class="lang-btn" data-lang="en" onclick="setLanguage('en', true)">English</button>
    <button type="button" class="lang-btn" data-lang="zh" onclick="setLanguage('zh', true)">繁體中文</button>
    <button type="button" class="lang-btn" data-lang="ko" onclick="setLanguage('ko', true)">한국어</button>
  </div>

  <div class="header">

    <p id="siteSubtitle"></p>
    <div id="unlockStatus" class="status-bar"></div>
  </div>

  <!-- 絞り込み・GPSエリア -->
  <div class="filter-panel">
    <div class="filter-group">
      <span class="filter-label" id="labelCategory"></span>
      <div class="chip-row" id="categoryBar"></div>
    </div>

    <div class="filter-group">
      <span class="filter-label" id="labelArea"></span>
      <div class="chip-row" id="areaBar"></div>
    </div>

    <div class="gps-row">
      <button type="button" class="gps-btn" id="gpsBtn" onclick="sortByGPS()"></button>
      <button type="button" class="gps-reset-btn" id="gpsResetBtn" onclick="resetGPS()" style="display:none;"></button>
      <span class="gps-status" id="gpsStatus"></span>
    </div>
  </div>

  <!-- クーポン一覧 -->
  <div class="coupon-grid" id="couponList"></div>
</div>

<!-- パスワード入力モーダル -->
<div class="modal-overlay" id="pwModal">
  <div class="modal-box">
    <button class="close-btn" onclick="closeModal('pwModal')" aria-label="Close">&times;</button>
    <h3 id="pwTitle" style="margin-top:0;"></h3>
    <p id="pwDesc" style="font-size:13px; color:#666; margin-bottom:4px;"></p>
    <input type="password" id="pwInput" class="pw-input" onkeydown="if(event.key==='Enter') checkPassword()">
    <br>
    <button type="button" class="btn" id="pwSubmitBtn" onclick="checkPassword()"></button>
    <p class="error-msg" id="pwError"></p>
  </div>
</div>

<!-- クーポン詳細・利用モーダル -->
<div class="modal-overlay" id="detailModal">

    <button class="close-btn" onclick="closeModal('detailModal')" aria-label="Close">&times;</button>

    <div class="meta-row" style="justify-content:center; margin-bottom:8px;">
      <span id="detailCategory" class="badge badge-cat"></span>
      <span id="detailArea" class="badge badge-area"></span>
    </div>
    <h3 id="detailTitle" style="margin:0 0 8px; font-size:18px;"></h3>
    <p id="detailDesc" style="font-size:14px; color:#333; margin:0; line-height:1.6;"></p>
    <div class="detail-terms" id="detailTerms"></div>
    <button type="button" id="useBtn" class="btn btn-use" onclick="useCoupon()"></button>
    <p id="staffNote" style="font-size:11px; color:#888; margin-top:8px;"></p>
  </div>
</div>
