<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>限定クーポン一覧 | Inbound Coupon Portal</title>
  <style>
    :root {
      --bg-page: #f4f6f9;
      --bg-surface: #ffffff;
      --bg-subtle: #eef2f7;
      --text-main: #18202c;
      --text-muted: #5c687a;
      --accent: #0f62fe;
      --accent-hover: #0043ce;
      --accent-soft: #e8f0fe;
      --success: #0e7a47;
      --success-soft: #e6f6ee;
      --warning: #9a5b00;
      --warning-soft: #fff4e0;
      --border: #dde3ec;
      --shadow-sm: 0 2px 8px rgba(16, 24, 40, 0.05);
      --shadow-md: 0 10px 28px rgba(16, 24, 40, 0.12);
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", "Noto Sans CJK TC", "Noto Sans CJK KR", sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      line-height: 1.6;
    }

    a {
      color: var(--accent);
    }

    button {
      font-family: inherit;
      cursor: pointer;
    }

    .container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 20px 16px 64px;
    }

    /* Top bar & Language Switcher */
    .topbar {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .lang-btn {
      border: 1px solid var(--border);
      background: var(--bg-surface);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.15s ease;
    }

    .lang-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .lang-btn.active {
      background: var(--text-main);
      color: #ffffff;
      border-color: var(--text-main);
    }

    /* Header */
    .hero {
      text-align: center;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 28px 20px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 18px;
    }

    .hero-title {
      margin: 0 0 8px;
      font-size: clamp(22px, 4vw, 32px);
      font-weight: 800;
      letter-spacing: -0.01em;
    }

    .hero-subtitle {
      margin: 0 auto 14px;
      max-width: 720px;
      color: var(--text-muted);
      font-size: 14px;
    }

    .auth-status-row {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .auth-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
    }

    .auth-badge.unlocked {
      background: var(--success-soft);
      color: var(--success);
    }

    .auth-badge.locked {
      background: var(--warning-soft);
      color: var(--warning);
    }

    .btn-secondary-sm {
      border: 1px solid var(--border);
      background: var(--bg-surface);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }

    .btn-secondary-sm:hover {
      background: var(--bg-subtle);
    }

    /* Filter Panel */
    .filter-panel {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 22px;
    }

    .filter-group {
      margin-bottom: 14px;
    }

    .filter-group:last-child {
      margin-bottom: 0;
    }

    .filter-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .chip-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      border: 1px solid var(--border);
      background: var(--bg-surface);
      color: var(--text-main);
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.15s ease;
    }

    .chip:hover {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
    }

    .chip.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    .sort-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      padding-top: 6px;
      border-top: 1px solid var(--bg-subtle);
    }

    .btn-sort {
      border: none;
      background: var(--success);
      color: #ffffff;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-sort:hover {
      filter: brightness(0.95);
    }

    .btn-sort.active {
      background: #085530;
      box-shadow: 0 0 0 3px rgba(14, 122, 71, 0.22);
    }

    .sort-hint {
      font-size: 12px;
      color: var(--text-muted);
    }

    .translation-banner {
      margin-top: 10px;
      font-size: 12px;
      color: var(--accent);
      min-height: 18px;
    }

    /* Coupon Grid */
    .coupon-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    .coupon-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      transition: transform 0.16s ease, box-shadow 0.16s ease;
      cursor: pointer;
    }

    .coupon-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
    }

    /* 1200x750 = 1.6 : 1 ratio */
    .coupon-thumb-wrap {
      width: 100%;
      aspect-ratio: 1200 / 750;
      background: var(--bg-subtle);
      overflow: hidden;
      position: relative;
    }

    .coupon-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .coupon-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }

    .meta-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .tag {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 999px;
    }

    .tag-status-available {
      background: var(--success-soft);
      color: var(--success);
    }

    .tag-status-progress {
      background: var(--warning-soft);
      color: var(--warning);
    }

    .tag-status-used {
      background: #e9edf3;
      color: #4b5565;
    }

    .tag-meta {
      background: var(--bg-subtle);
      color: var(--text-main);
    }

    .tag-distance {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .coupon-title {
      margin: 2px 0 0;
      font-size: 17px;
      font-weight: 800;
      line-height: 1.4;
    }

    .coupon-summary {
      margin: 0;
      font-size: 13px;
      color: var(--text-muted);
    }

    .coupon-store {
      margin-top: auto;
      padding-top: 6px;
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 48px 20px;
      background: var(--bg-surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius-md);
      color: var(--text-muted);
    }

    /* Modal Backdrop & Dialog */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.58);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 1000;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-dialog {
      width: 100%;
      max-width: 640px;
      max-height: 90vh;
      overflow-y: auto;
      background: var(--bg-surface);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      padding: 22px;
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 34px;
      height: 34px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg-surface);
      font-size: 18px;
      line-height: 1;
      color: var(--text-main);
    }

    .modal-image-wrap {
      width: 100%;
      aspect-ratio: 1200 / 750;
      border-radius: var(--radius-md);
      overflow: hidden;
      background: var(--bg-subtle);
      margin-bottom: 14px;
    }

    .modal-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .modal-title {
      margin: 6px 0 8px;
      font-size: 21px;
      font-weight: 800;
      padding-right: 36px;
    }

    .modal-desc {
      margin: 0 0 16px;
      font-size: 14px;
      color: var(--text-main);
      white-space: pre-line;
    }

    .code-box {
      background: var(--accent-soft);
      border: 1px solid #bfd4fe;
      border-radius: var(--radius-md);
      padding: 12px 14px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .code-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
    }

    .code-value {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 17px;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: 0.04em;
    }

    .btn-copy {
      border: none;
      background: var(--accent);
      color: #ffffff;
      padding: 7px 12px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 700;
    }

    .booking-box {
      background: #f5f9ff;
      border: 1px solid #cfe0fc;
      border-left: 4px solid var(--accent);
      border-radius: var(--radius-md);
      padding: 14px;
      margin-bottom: 16px;
    }

    .booking-heading {
      font-size: 13px;
      font-weight: 800;
      color: var(--accent);
      margin: 0 0 6px;
    }

    .booking-note {
      margin: 0 0 10px;
      font-size: 13px;
      color: var(--text-main);
      white-space: pre-line;
    }

    .booking-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent);
      color: #ffffff;
      text-decoration: none;
      padding: 9px 16px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 700;
    }

    .booking-link:hover {
      background: var(--accent-hover);
    }

    .info-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 18px;
      font-size: 13px;
    }

    .info-table th,
    .info-table td {
      padding: 9px 10px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: top;
    }

    .info-table th {
      width: 110px;
      color: var(--text-muted);
      font-weight: 700;
    }

    .usage-box {
      background: var(--bg-subtle);
      border-radius: var(--radius-md);
      padding: 14px;
    }

    .usage-title {
      font-size: 13px;
      font-weight: 800;
      margin: 0 0 10px;
    }

    .usage-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-primary {
      border: none;
      background: var(--accent);
      color: #ffffff;
      padding: 10px 16px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 700;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-confirm {
      border: none;
      background: var(--success);
      color: #ffffff;
      padding: 10px 16px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 700;
    }

    .btn-reset {
      border: 1px solid var(--border);
      background: var(--bg-surface);
      color: var(--text-muted);
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 600;
    }

    .password-input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 15px;
      margin: 10px 0;
    }

    .error-text {
      color: #c62828;
      font-size: 13px;
      font-weight: 700;
      min-height: 20px;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar" id="langSwitcher">
      <button class="lang-btn active" data-lang="ja">日本語</button>
      <button class="lang-btn" data-lang="en">English</button>
      <button class="lang-btn" data-lang="zh-TW">繁體中文</button>
      <button class="lang-btn" data-lang="ko">한국어</button>
    </div>

    <header class="hero">
      <h1 class="hero-title" id="heroTitle">限定クーポン一覧</h1>
      <p class="hero-subtitle" id="heroSubtitle">
        言語・カテゴリ・エリアで絞り込めます。クーポンをタップしてパスワードを入力すると詳細が開きます。パスワードはJAPAN QUALITY SIMをご購入後、メール本文に記載しております。
      </p>
      <div class="auth-status-row">
        <span class="auth-badge locked" id="authBadge">パスワード未解除</span>
        <button class="btn-secondary-sm" id="openPasswordBtn" type="button">パスワード入力</button>
      </div>
    </header>

    <section class="filter-panel" aria-label="絞り込み・並び替え">
      <div class="filter-group">
        <div class="filter-label" id="categoryLabel">カテゴリ</div>
        <div class="chip-list" id="categoryChips"></div>
      </div>

      <div class="filter-group">
        <div class="filter-label" id="areaLabel">エリア</div>
        <div class="chip-list" id="areaChips"></div>
      </div>

      <div class="sort-row">
        <button class="btn-sort" id="sortByDistanceBtn" type="button">
          <span>現在地から近い順に並べる</span>
        </button>
        <span class="sort-hint" id="sortHint">※位置情報を許可すると近いクーポン順に表示できます</span>
      </div>

      <div class="translation-banner" id="translationBanner"></div>
    </section>

    <main class="coupon-grid" id="couponGrid"></main>
  </div>

  <!-- Password Modal -->
  <div class="modal-backdrop" id="passwordModal" role="dialog" aria-modal="true" aria-labelledby="pwModalTitle">
    <div class="modal-dialog" style="max-width: 440px;">
      <button class="modal-close" id="closePasswordModal" type="button" aria-label="閉じる">&times;</button>
      <h2 class="modal-title" id="pwModalTitle">クーポン詳細のロック解除</h2>
      <p class="coupon-summary" id="pwModalDesc">メールに記載の共有パスワードを入力してください。</p>
      <form id="passwordForm">
        <input class="password-input" type="password" id="passwordInput" autocomplete="current-password" placeholder="パスワードを入力" required />
        <div class="error-text" id="passwordError"></div>
        <button class="btn-primary" type="submit" id="pwSubmitBtn" style="width: 100%;">解除する</button>
      </form>
    </div>
  </div>

  <!-- Coupon Detail Modal -->
  <div class="modal-backdrop" id="detailModal" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
    <div class="modal-dialog">
      <button class="modal-close" id="closeDetailModal" type="button" aria-label="閉じる">&times;</button>
      <div id="detailContent"></div>
    </div>
  </div>

      }
      localStorage.setItem(USAGE_STORAGE_KEY, JSON.stringify(map));

    // =========================================================================
    // 4. 自動翻訳（MyMemory API + sessionStorage キャッシュ）
    // =========================================================================
    async function translateText(text, targetLang) {
      if (!text || targetLang === "ja") return text;
      const apiLang = MYMEMORY_LANG_MAP[targetLang];
      if (!apiLang) return text;

      const cacheKey = `${TRANSLATION_CACHE_PREFIX}${targetLang}_${text}`;
      const cachedSession = sessionStorage.getItem(cacheKey);
      if (cachedSession) return cachedSession;

      try {
        const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=ja|${encodeURIComponent(apiLang)}`;
        const res = await fetch(url);
        if (!res.ok) return text;
        const data = await res.json();
        const translated = data?.responseData?.translatedText;
        if (translated && typeof translated === "string") {
          sessionStorage.setItem(cacheKey, translated);
          return translated;
        }
      } catch (err) {
        console.warn("Translation fallback:", err);
      }
      return text;
    }

    async function ensureLanguageTranslated(lang) {
      const bannerEl = document.getElementById("translationBanner");
      if (lang === "ja") {
        bannerEl.textContent = "";
        return;
      }

      if (state.translatedCache[lang]) {
        bannerEl.textContent = I18N[lang].translationNotice;
        return;
      }

      bannerEl.textContent = I18N[lang].translating;

      // カテゴリ・エリア翻訳
      for (const key of CATEGORY_KEYS) {
        if (I18N[lang].categories[key] === I18N.ja.categories[key]) {
          I18N[lang].categories[key] = await translateText(I18N.ja.categories[key], lang);
        }
      }
      for (const key of AREA_KEYS) {
        if (I18N[lang].areas[key] === I18N.ja.areas[key]) {
          I18N[lang].areas[key] = await translateText(I18N.ja.areas[key], lang);
        }
      }

      // クーポン文面翻訳
      const couponTranslations = {};
      for (const cp of COUPONS) {
        couponTranslations[cp.id] = {
          title: await translateText(cp.title, lang),
          summary: await translateText(cp.summary, lang),
          description: await translateText(cp.description, lang),
          bookingNote: cp.bookingNote ? await translateText(cp.bookingNote, lang) : "",
          storeName: await translateText(cp.storeName, lang),
          address: await translateText(cp.address, lang)
        };
      }

      state.translatedCache[lang] = couponTranslations;
      bannerEl.textContent = I18N[lang].translationNotice;
    }

    function getLocalizedCoupon(coupon) {
      if (state.lang === "ja") return coupon;
      const tr = state.translatedCache[state.lang]?.[coupon.id];
      if (!tr) return coupon;
      return {
        ...coupon,
        title: tr.title || coupon.title,
        summary: tr.summary || coupon.summary,
        description: tr.description || coupon.description,
        bookingNote: coupon.bookingNote ? (tr.bookingNote || coupon.bookingNote) : "",
        storeName: tr.storeName || coupon.storeName,
        address: tr.address || coupon.address
      };
    }

    // =========================================================================
    // 5. 距離計算（Haversine）
    // =========================================================================
    function calcDistanceKm(lat1, lon1, lat2, lon2) {
      if (typeof lat1 !== "number" || typeof lon1 !== "number" || typeof lat2 !== "number" || typeof lon2 !== "number") {
        return Infinity;
      }
      const R = 6371;
      const dLat = ((lat2 - lat1) * Math.PI) / 180;
      const dLon = ((lon2 - lon1) * Math.PI) / 180;
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos((lat1 * Math.PI) / 180) *
          Math.cos((lat2 * Math.PI) / 180) *
          Math.sin(dLon / 2) *
          Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    function renderCoupons() {
      const dict = t();
      const grid = document.getElementById("couponGrid");

        return { raw: cp, localized: getLocalizedCoupon(cp), distKm };
      });

      if (state.sortByDistance && state.userLocation) {

          <span class="tag ${status.cls}">${escapeHtml(status.label)}</span>
          <span class="tag tag-meta">${escapeHtml(dict.categories[cp.categoryKey] || cp.categoryKey)}</span>
          <span class="tag tag-meta">${escapeHtml(dict.areas[cp.areaKey] || cp.areaKey)}</span>
        </div>
        <h2 class="modal-title" id="detailTitle">${escapeHtml(cp.title)}</h2>
        <p class="modal-desc">${escapeHtml(cp.description)}</p>

        ${codeHtml}
        ${bookingHtml}

        <table class="info-table">
          <tbody>
            <tr>
              <th>${escapeHtml(dict.storeLabel)}</th>
              <td>${escapeHtml(cp.storeName)}</td>
            </tr>
            <tr>
              <th>${escapeHtml(dict.addressLabel)}</th>
              <td>
                <div>${escapeHtml(cp.address)}</div>
                <a href="${escapeAttr(mapUrl)}" target="_blank" rel="noopener noreferrer">${escapeHtml(dict.openMap)} ↗</a>
              </td>
            </tr>
            ${
              cp.phone
                ? `
                  <tr>
                    <th>${escapeHtml(dict.phoneLabel)}</th>
                    <td><a href="${escapeAttr(telHref)}">${escapeHtml(cp.phone)}</a></td>
                  </tr>
                `
                : ""
            }
          </tbody>
        </table>

        <div class="usage-box">
          <div class="usage-title">${escapeHtml(dict.usageTitle)}（${escapeHtml(status.label)}）</div>
          <div class="usage-actions">
            <button class="btn-primary" type="button" id="step1Btn" ${currentStep >= 1 ? "disabled" : ""}>
              ${escapeHtml(dict.step1Btn)}
            </button>
            <button class="btn-confirm" type="button" id="step2Btn" ${currentStep >= 2 ? "disabled" : ""}>
              ${escapeHtml(dict.step2Btn)}
            </button>
            <button class="btn-reset" type="button" id="resetStepBtn">
              ${escapeHtml(dict.resetBtn)}
            </button>
          </div>
        </div>
      `;

      const copyBtn = document.getElementById("copyCodeBtn");
      if (copyBtn) {
        copyBtn.addEventListener("click", async () => {
          try {
            await navigator.clipboard.writeText(cp.couponCode);
            copyBtn.textContent = dict.copiedCode;
            setTimeout(() => {
              copyBtn.textContent = dict.copyCode;
            }, 1500);
          } catch {
            copyBtn.textContent = dict.copiedCode;
          }
        });
      }

      document.getElementById("step1Btn").addEventListener("click", () => {
        setUsageStep(cp.id, 1);
        renderDetailModalContent();
        renderCoupons();
      });

      document.getElementById("step2Btn").addEventListener("click", () => {
        setUsageStep(cp.id, 2);
        renderDetailModalContent();
        renderCoupons();
      });

      document.getElementById("resetStepBtn").addEventListener("click", () => {
        setUsageStep(cp.id, 0);
        renderDetailModalContent();
        renderCoupons();
      });
    }

    // =========================================================================
    // 7. エスケープ＆イベント登録
    // =========================================================================
    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function escapeAttr(str) {
      return escapeHtml(str);
    }

    function bindEvents() {
      document.querySelectorAll(".lang-btn").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const nextLang = btn.dataset.lang;
          if (!SUPPORTED_LANGS.includes(nextLang)) return;
          state.lang = nextLang;

          document.querySelectorAll(".lang-btn").forEach((b) => {
            b.classList.toggle("active", b.dataset.lang === nextLang);
          });

          renderStaticTexts();
          renderFilterChips();
          renderCoupons();

          await ensureLanguageTranslated(nextLang);
          renderStaticTexts();
          renderFilterChips();
          renderCoupons();
          if (state.activeCouponId) {
            renderDetailModalContent();
          }
        });
      });

      document.getElementById("openPasswordBtn").addEventListener("click", () => {
        state.pendingCouponIdAfterAuth = null;
        openPasswordModal();
      });

      document.getElementById("closePasswordModal").addEventListener("click", closePasswordModal);
      document.getElementById("closeDetailModal").addEventListener("click", closeDetailModal);

      document.getElementById("passwordModal").addEventListener("click", (e) => {
        if (e.target.id === "passwordModal") closePasswordModal();
      });

      document.getElementById("detailModal").addEventListener("click", (e) => {
        if (e.target.id === "detailModal") closeDetailModal();
      });

      document.getElementById("passwordForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const inputVal = document.getElementById("passwordInput").value;
        if (inputVal === SHARED_PASSWORD) {
          setUnlocked();
          closePasswordModal();
          renderCoupons();
          if (state.pendingCouponIdAfterAuth) {
            const targetId = state.pendingCouponIdAfterAuth;
            state.pendingCouponIdAfterAuth = null;
            openDetailModal(targetId);
          }
        } else {
          document.getElementById("passwordError").textContent = t().pwError;
        }
      });

      document.getElementById("sortByDistanceBtn").addEventListener("click", () => {
        const dict = t();
        if (state.sortByDistance) {
          state.sortByDistance = false;
          renderStaticTexts();
          renderCoupons();
          return;
        }

        if (!navigator.geolocation) {
          alert(dict.geoUnsupported);
          return;
        }

        navigator.geolocation.getCurrentPosition(
          (pos) => {
            state.userLocation = {
              lat: pos.coords.latitude,
              lng: pos.coords.longitude
            };
            state.sortByDistance = true;
            renderStaticTexts();
            renderCoupons();
          },
          () => {
            alert(dict.geoDenied);
          }
        );
      });
    }

    // 初期起動
    bindEvents();
    renderStaticTexts();
    renderFilterChips();
    renderCoupons();
  </script>
</body>
</html>
