<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Special Coupons</title>
<style>
  :root {
    --bg: #f4f6f9;
    --card: #ffffff;
    --text: #222222;
    --muted: #666666;
    --primary: #1677ff;
    --danger: #ff4d4f;
    --border: #d9dfe6;
  }
  * {
    box-sizing: border-box;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Hiragino Sans", "Yu Gothic", "Noto Sans CJK JP", "Noto Sans CJK TC", "Noto Sans CJK KR", sans-serif;
    background-color: var(--bg);
    margin: 0;
    padding: 14px 14px 44px;
    color: var(--text);
  }
  .container {
    max-width: 960px;
    margin: 0 auto;
  }

  /* 言語切り替えバー */
  .lang-bar {
    display: flex;
    justify-content: flex-end;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 10px;
  }
  .lang-btn {
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text);
    padding: 6px 11px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
  }
  .lang-btn.active {
    background: #1f2937;
    color: #fff;
    border-color: #1f2937;
  }

  .header {
    text-align: center;
    margin: 4px auto 18px;
    max-width: 780px;
  }
  .header h1 {
    font-size: 22px;
    margin: 0 0 6px;
  }
  .header p {
    font-size: 13px;
    color: var(--muted);
    margin: 0;
    line-height: 1.5;
  }
  .status-bar {
    display: inline-block;
    margin-top: 10px;
    font-size: 12px;
    padding: 5px 12px;
    border-radius: 999px;
    background: #e9ecef;
    color: #495057;
  }
  .status-bar.unlocked {
    background: #d4edda;
    color: #155724;
    font-weight: bold;
  }

  /* 絞り込み・GPSコントロールパネル */
  .filter-panel {
    background: var(--card);
    border-radius: 14px;
    padding: 14px 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    margin-bottom: 20px;
  }
  .filter-group {
    margin-bottom: 12px;
  }
  .filter-group:last-child {
    margin-bottom: 0;
  }
  .filter-label {
    font-size: 12px;
    font-weight: bold;
    color: var(--muted);
    margin-bottom: 6px;
    display: block;
  }
  .chip-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  .chip-btn {
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text);
    padding: 7px 13px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.15s;
  }
  .chip-btn:hover {
    border-color: var(--primary);
    color: var(--primary);
  }
  .chip-btn.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }
  .gps-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    padding-top: 10px;
    border-top: 1px solid #eef1f5;
  }
  .gps-btn {
    background: #0f766e;
    color: #fff;
    border: none;
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
  }
  .gps-btn:hover {
    opacity: 0.92;
  }
  .gps-reset-btn {
    background: #eef1f5;
    color: #333;
    border: none;
    padding: 8px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
  }
  .gps-status {
    font-size: 12px;
    color: var(--muted);
  }

  /* クーポン一覧グリッド */
  .coupon-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(275px, 1fr));
    gap: 16px;
  }
  .coupon-card {
    background: var(--card);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 3px 10px rgba(0,0,0,0.07);
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    display: flex;
    flex-direction: column;
  }
  .coupon-card:hover {
    box-shadow: 0 6px 16px rgba(0,0,0,0.11);
  }
  .coupon-card:active {
    transform: scale(0.98);
  }
  .coupon-card img {
    width: 100%;
    height: 160px;
    object-fit: cover;
    display: block;
    background: #e9ecef;
  }
  .coupon-info {
    padding: 14px 16px 16px;
    flex: 1;
  }
  .meta-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 8px;
  }
  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: bold;
    padding: 3px 8px;
    border-radius: 5px;
  }
  .badge-available {
    background: var(--danger);
    color: #fff;
  }
  .badge-used {
    background: #8c8c8c;
    color: #fff;
  }
  .badge-cat {
    background: #eef4ff;
    color: var(--primary);
  }
  .badge-area {
    background: #f0fdf4;
    color: #15803d;
  }
  .badge-dist {
    background: #fff7ed;
    color: #c2410c;
  }
  .coupon-title {
    font-size: 16px;
    font-weight: bold;
    margin: 0 0 6px;
    line-height: 1.4;
  }
  .coupon-desc {
    font-size: 13px;
    color: var(--muted);
    margin: 0;
    line-height: 1.5;
  }
  .empty-msg {
    grid-column: 1 / -1;
    text-align: center;
    padding: 34px 16px;
    background: var(--card);
    border-radius: 12px;
    color: var(--muted);
    font-size: 14px;
  }

  /* モーダル */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    justify-content: center;
    align-items: center;
    z-index: 1000;
    padding: 16px;
  }
  .modal-box {
    background: var(--card);
    border-radius: 16px;
    width: 100%;
    max-width: 420px;
    padding: 24px 20px;
    text-align: center;
    position: relative;
    box-shadow: 0 12px 30px rgba(0,0,0,0.22);
    max-height: 90vh;
    overflow-y: auto;
  }
  .close-btn {
    position: absolute;
    top: 10px;
    right: 14px;
    font-size: 26px;
    line-height: 1;
    color: #888;
    cursor: pointer;
    border: none;
    background: none;
  }
  .pw-input {
    width: 84%;
    padding: 11px;
    font-size: 16px;
    border: 2px solid #d9d9d9;
    border-radius: 8px;
    margin: 12px 0;
    text-align: center;
  }
  .pw-input:focus {
    outline: none;
    border-color: var(--primary);
  }
  .btn {
    background: var(--primary);
    color: #fff;
    border: none;
    padding: 12px 18px;
    font-size: 14px;
    font-weight: bold;
    border-radius: 8px;
    cursor: pointer;
    width: 90%;
  }
  .btn:hover {
    opacity: 0.93;
  }
  .btn-use {
    background: var(--danger);
    margin-top: 16px;
  }
  .btn-used {
    background: #bfbfbf;
    cursor: not-allowed;
    margin-top: 16px;
  }
  .error-msg {
    color: #cf1322;
    font-size: 13px;
    margin-top: 8px;
    display: none;
  }
  .detail-img {
    width: 100%;
    height: 155px;
    object-fit: cover;
    border-radius: 10px;
    margin-bottom: 12px;
    background: #e9ecef;
  }
  .detail-terms {
    background: #f6f7f9;
    padding: 11px 12px;
    border-radius: 8px;
    font-size: 12px;
    color: #555;
    text-align: left;
    margin-top: 12px;
    white-space: pre-line;
    line-height: 1.6;
  }
</style>
</head>

<div class="container">
  <!-- 言語切り替え -->
  <div class="lang-bar" id="langBar">
    <button type="button" class="lang-btn" data-lang="ja" onclick="setLanguage('ja', true)">日本語</button>
    <button type="button" class="lang-btn" data-lang="en" onclick="setLanguage('en', true)">English</button>
    <button type="button" class="lang-btn" data-lang="zh" onclick="setLanguage('zh', true)">繁體中文</button>
    <button type="button" class="lang-btn" data-lang="ko" onclick="setLanguage('ko', true)">한국어</button>
  </div>

  <div class="header">
    <h1 id="siteTitle"></h1>
    <p id="siteSubtitle"></p>
    <div id="unlockStatus" class="status-bar"></div>
  </div>

  <!-- 絞り込み・GPSエリア -->
  <div class="filter-panel">
    <div class="filter-group">
      <span class="filter-label" id="labelCategory"></span>
      <div class="chip-row" id="categoryBar"></div>
    </div>

    <div class="filter-group">
      <span class="filter-label" id="labelArea"></span>
      <div class="chip-row" id="areaBar"></div>
    </div>

    <div class="gps-row">
      <button type="button" class="gps-btn" id="gpsBtn" onclick="sortByGPS()"></button>
      <button type="button" class="gps-reset-btn" id="gpsResetBtn" onclick="resetGPS()" style="display:none;"></button>
      <span class="gps-status" id="gpsStatus"></span>
    </div>
  </div>

  <!-- クーポン一覧 -->
  <div class="coupon-grid" id="couponList"></div>
</div>

<!-- パスワード入力モーダル -->
<div class="modal-overlay" id="pwModal">
  <div class="modal-box">
    <button class="close-btn" onclick="closeModal('pwModal')" aria-label="Close">&times;</button>
    <h3 id="pwTitle" style="margin-top:0;"></h3>
    <p id="pwDesc" style="font-size:13px; color:#666; margin-bottom:4px;"></p>
    <input type="password" id="pwInput" class="pw-input" onkeydown="if(event.key==='Enter') checkPassword()">
    <br>
    <button type="button" class="btn" id="pwSubmitBtn" onclick="checkPassword()"></button>
    <p class="error-msg" id="pwError"></p>
  </div>
</div>

<!-- クーポン詳細・利用モーダル -->
<div class="modal-overlay" id="detailModal">
  <div class="modal-box">
    <button class="close-btn" onclick="closeModal('detailModal')" aria-label="Close">&times;</button>
    <img id="detailImg" class="detail-img" src="" alt="">
    <div class="meta-row" style="justify-content:center; margin-bottom:8px;">
      <span id="detailCategory" class="badge badge-cat"></span>
      <span id="detailArea" class="badge badge-area"></span>
    </div>
    <h3 id="detailTitle" style="margin:0 0 8px; font-size:18px;"></h3>
    <p id="detailDesc" style="font-size:14px; color:#333; margin:0; line-height:1.6;"></p>
    <div class="detail-terms" id="detailTerms"></div>
    <button type="button" id="useBtn" class="btn btn-use" onclick="useCoupon()"></button>
    <p id="staffNote" style="font-size:11px; color:#888; margin-top:8px;"></p>
  </div>
</div>

function detectInitialLanguage() {
  try {
    const savedLang = sessionStorage.getItem("selected_coupon_lang");
    if (savedLang && I18N[savedLang]) {
      return savedLang;
    }
  } catch (e) {}

  const candidates = [];
  if (Array.isArray(navigator.languages)) candidates.push(...navigator.languages);
  if (navigator.language) candidates.push(navigator.language);

  for (const raw of candidates) {
    const code = String(raw).toLowerCase();
    if (code.startsWith("en")) return "en";
    if (code.startsWith("zh")) return "zh";
    if (code.startsWith("ko")) return "ko";
    if (code.startsWith("ja")) return "ja";
  }
  return "ja";
}

let currentLang = detectInitialLanguage();
let selectedCategory = "all";
let selectedArea = "all";
let gpsSorted = false;
let gpsState = "idle";
let distanceMap = {};
let currentCoupon = null;
let pendingUseConfirm = false;

// 自動翻訳キャッシュ（メモリ + sessionStorage）
const autoTranslateCache = {};
const inflightTranslations = new Set();

function getApiLangCode(lang) {
  if (lang === "en") return "en";
  if (lang === "zh") return "zh-TW";
  if (lang === "ko") return "ko";
  return "ja";
}

function getCacheKey(couponId, field, lang, sourceText) {
  return `auto_tr_${couponId}_${lang}_${field}_${sourceText}`;
}

function getCachedTranslation(couponId, field, lang, sourceText) {
  const key = getCacheKey(couponId, field, lang, sourceText);
  if (autoTranslateCache[key]) return autoTranslateCache[key];
  try {
    const val = sessionStorage.getItem(key);
    if (val) {
      autoTranslateCache[key] = val;
      return val;
    }
  } catch (e) {}
  return null;
}

function setCachedTranslation(couponId, field, lang, sourceText, translatedText) {
  const key = getCacheKey(couponId, field, lang, sourceText);
  autoTranslateCache[key] = translatedText;
  try {
    sessionStorage.setItem(key, translatedText);
  } catch (e) {}
}

async function translateText(text, targetLang) {
  if (!text || targetLang === "ja") return text;
  const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=ja|${encodeURIComponent(getApiLangCode(targetLang))}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error("Translation API failed");
  const data = await res.json();
  const translated = data && data.responseData && data.responseData.translatedText;
  if (!translated || typeof translated !== "string") throw new Error("Invalid response");
  return translated;
}

// 必要な自動翻訳をバックグラウンドで実行し、完了後に再描画する
function ensureTranslationsForCurrentLang() {
  if (currentLang === "ja") return;

  const fields = ["title", "shortDesc", "detailDesc", "terms"];
  let anyStarted = false;

  coupons.forEach(coupon => {
    const jaData = coupon.i18n.ja || {};
    const manualData = coupon.i18n[currentLang] || {};

    fields.forEach(field => {
      if (manualData[field]) return; // 手動指定があればスキップ
      const sourceText = jaData[field] || "";
      if (!sourceText) return;
      if (getCachedTranslation(coupon.id, field, currentLang, sourceText)) return;

      const taskKey = `${coupon.id}_${field}_${currentLang}`;
      if (inflightTranslations.has(taskKey)) return;

      inflightTranslations.add(taskKey);
      anyStarted = true;

      translateText(sourceText, currentLang)
        .then(translated => {
          setCachedTranslation(coupon.id, field, currentLang, sourceText, translated);
          renderCoupons();
          if (document.getElementById("detailModal").style.display === "flex" && currentCoupon && currentCoupon.id === coupon.id) {
            openDetailModal();
          }
        })
        .catch(() => {
          // 失敗時は日本語のまま表示を維持
        })
        .finally(() => {
          inflightTranslations.delete(taskKey);
        });
    });
  });

  return anyStarted;
}

function t() {
  return I18N[currentLang] || I18N.ja;
}

function getCouponText(coupon) {
  const jaData = coupon.i18n.ja || {};
  if (currentLang === "ja") {
    return {
      title: jaData.title || "",
      shortDesc: jaData.shortDesc || "",
      detailDesc: jaData.detailDesc || "",
      terms: jaData.terms || ""
    };
  }

  const manualData = coupon.i18n[currentLang] || {};
  const resolveField = field => {
    if (manualData[field]) return manualData[field];
    const src = jaData[field] || "";
    const cached = getCachedTranslation(coupon.id, field, currentLang, src);
    return cached || src;
  };

  return {
    title: resolveField("title"),
    shortDesc: resolveField("shortDesc"),
    detailDesc: resolveField("detailDesc"),
    terms: resolveField("terms")
  };
}

function setLanguage(lang, saveChoice = false) {
  if (!I18N[lang]) return;
  currentLang = lang;
  if (saveChoice) {
    try {
      sessionStorage.setItem("selected_coupon_lang", lang);
    } catch (e) {}
  }

  document.documentElement.lang = lang === "zh" ? "zh-Hant" : lang;
  document.title = t().pageTitle;

  document.querySelectorAll(".lang-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.lang === lang);
  });

  applyStaticTexts();
  renderFilterChips();
  renderCoupons();
  ensureTranslationsForCurrentLang();

  if (document.getElementById("detailModal").style.display === "flex" && currentCoupon) {
    openDetailModal();
  }
}

function applyStaticTexts() {
  const dict = t();
  document.getElementById("siteTitle").textContent = dict.siteTitle;
  document.getElementById("siteSubtitle").textContent = dict.siteSubtitle;
  document.getElementById("labelCategory").textContent = dict.labelCategory;
  document.getElementById("labelArea").textContent = dict.labelArea;
  document.getElementById("gpsBtn").textContent = dict.gpsBtn;
  document.getElementById("gpsResetBtn").textContent = dict.gpsResetBtn;
  document.getElementById("gpsResetBtn").style.display = gpsSorted ? "inline-block" : "none";

  const gpsStatusEl = document.getElementById("gpsStatus");
  if (gpsState === "loading") gpsStatusEl.textContent = dict.gpsLoading;
  else if (gpsState === "sorted") gpsStatusEl.textContent = dict.gpsSorted;
  else if (gpsState === "error") gpsStatusEl.textContent = dict.gpsError;
  else if (gpsState === "unsupported") gpsStatusEl.textContent = dict.gpsUnsupported;
  else gpsStatusEl.textContent = dict.gpsIdle;

  document.getElementById("pwTitle").textContent = dict.pwTitle;
  document.getElementById("pwDesc").textContent = dict.pwDesc;
  document.getElementById("pwInput").placeholder = dict.pwPlaceholder;
  document.getElementById("pwSubmitBtn").textContent = dict.pwSubmitBtn;
  document.getElementById("pwError").textContent = dict.pwError;
  document.getElementById("staffNote").textContent = dict.staffNote;

  updateUnlockBadge();
}

function isUnlocked() {
  try {
    return sessionStorage.getItem("shared_coupon_unlocked") === "true";
  } catch (e) {
    return false;
  }
}

function setUnlocked() {
  try {
    sessionStorage.setItem("shared_coupon_unlocked", "true");
  } catch (e) {}
}

function isCouponUsed(couponId) {
  try {
    return localStorage.getItem("coupon_used_" + couponId) === "true";
  } catch (e) {
    return false;
  }
}

function markCouponUsed(couponId) {
  try {
    localStorage.setItem("coupon_used_" + couponId, "true");
  } catch (e) {}
}

function updateUnlockBadge() {
  const badge = document.getElementById("unlockStatus");
  if (isUnlocked()) {
    badge.textContent = t().unlockedStatus;
    badge.className = "status-bar unlocked";
  } else {
    badge.textContent = t().lockedStatus;
    badge.className = "status-bar";
  }
}

function renderFilterChips() {
  const dict = t();
  const catBar = document.getElementById("categoryBar");
  catBar.innerHTML = "";

  const catOptions = [{ key: "all", label: dict.allCategories }].concat(
    CATEGORY_KEYS.map(k => ({ key: k, label: dict.categories[k] || k }))
  );
  catOptions.forEach(opt => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "chip-btn" + (selectedCategory === opt.key ? " active" : "");
    btn.textContent = opt.label;
    btn.onclick = () => {
      selectedCategory = opt.key;
      renderFilterChips();
      renderCoupons();
    };
    catBar.appendChild(btn);
  });

  const areaBar = document.getElementById("areaBar");
  areaBar.innerHTML = "";

  const areaOptions = [{ key: "all", label: dict.allAreas }].concat(
    AREA_KEYS.map(k => ({ key: k, label: dict.areas[k] || k }))
  );
  areaOptions.forEach(opt => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "chip-btn" + (selectedArea === opt.key ? " active" : "");
    btn.textContent = opt.label;
    btn.onclick = () => {
      selectedArea = opt.key;
      renderFilterChips();
      renderCoupons();
    };
    areaBar.appendChild(btn);
  });
}

function calcDistanceKm(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const toRad = deg => deg * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLng = toRad(lng2 - lng1);
  const a =
    Math.sin(dLat / 2) * Math.sin(dLat / 2) +
    Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
    Math.sin(dLng / 2) * Math.sin(dLng / 2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return R * c;
}

function sortByGPS() {
  if (!navigator.geolocation) {
    gpsState = "unsupported";
    applyStaticTexts();
    return;
  }

  gpsState = "loading";
  applyStaticTexts();

  navigator.geolocation.getCurrentPosition(
    pos => {
      const { latitude, longitude } = pos.coords;
      distanceMap = {};
      coupons.forEach(c => {
        if (typeof c.lat === "number" && typeof c.lng === "number") {
          distanceMap[c.id] = calcDistanceKm(latitude, longitude, c.lat, c.lng);
        }
      });
      gpsSorted = true;
      gpsState = "sorted";
      applyStaticTexts();
      renderCoupons();
    },
    () => {
      gpsState = "error";
      applyStaticTexts();
    },
    { enableHighAccuracy: false, timeout: 8000 }
  );
}

function resetGPS() {
  gpsSorted = false;
  gpsState = "idle";
  distanceMap = {};
  applyStaticTexts();
  renderCoupons();
}

function formatDistance(km) {
  if (typeof km !== "number") return "";
  if (km < 1) return `${Math.round(km * 1000)}m`;
  return `${km.toFixed(1)}km`;
}

function renderCoupons() {
  const dict = t();
  const list = document.getElementById("couponList");
  list.innerHTML = "";

  let filtered = coupons.filter(c => {
    const matchCat = selectedCategory === "all" || c.category === selectedCategory;
    const matchArea = selectedArea === "all" || c.area === selectedArea;
    return matchCat && matchArea;
  });

  if (gpsSorted) {
    filtered = [...filtered].sort((a, b) => {
      const da = typeof distanceMap[a.id] === "number" ? distanceMap[a.id] : Infinity;
      const db = typeof distanceMap[b.id] === "number" ? distanceMap[b.id] : Infinity;
      return da - db;
    });
  }

  if (filtered.length === 0) {
    list.innerHTML = `<div class="empty-msg">${dict.empty}</div>`;
    return;
  }

  filtered.forEach(c => {
    const text = getCouponText(c);
    const used = isCouponUsed(c.id);
    const distText = gpsSorted ? formatDistance(distanceMap[c.id]) : "";
    const catLabel = dict.categories[c.category] || c.category;
    const areaLabel = dict.areas[c.area] || c.area;

    const card = document.createElement("div");
    card.className = "coupon-card";
    card.onclick = () => handleCouponClick(c);

    card.innerHTML = `
      <img src="${c.image}" alt="${text.title}">
      <div class="coupon-info">
        <div class="meta-row">
          <span class="badge ${used ? 'badge-used' : 'badge-available'}">${used ? dict.used : dict.available}</span>
          <span class="badge badge-cat">${catLabel}</span>
          <span class="badge badge-area">${areaLabel}</span>
          ${distText ? `<span class="badge badge-dist">${distText}</span>` : ""}
        </div>
        <h2 class="coupon-title">${text.title}</h2>
        <p class="coupon-desc">${text.shortDesc}</p>
      </div>
    `;
    list.appendChild(card);
  });
}

function handleCouponClick(coupon) {
  currentCoupon = coupon;
  pendingUseConfirm = false;

  if (isUnlocked()) {
    openDetailModal();
  } else {
    document.getElementById("pwInput").value = "";
    document.getElementById("pwError").style.display = "none";
    document.getElementById("pwModal").style.display = "flex";
    setTimeout(() => document.getElementById("pwInput").focus(), 50);
  }
}

function checkPassword() {
  const input = document.getElementById("pwInput").value;
  if (input === SHARED_PASSWORD) {
    setUnlocked();
    closeModal("pwModal");
    updateUnlockBadge();
    openDetailModal();
  } else {
    document.getElementById("pwError").style.display = "block";
  }
}

function openDetailModal() {
  if (!currentCoupon) return;
  const dict = t();
  const text = getCouponText(currentCoupon);

  pendingUseConfirm = false;
  document.getElementById("detailImg").src = currentCoupon.image;
  document.getElementById("detailCategory").textContent = dict.categories[currentCoupon.category] || currentCoupon.category;
  document.getElementById("detailArea").textContent = dict.areas[currentCoupon.area] || currentCoupon.area;
  document.getElementById("detailTitle").textContent = text.title;
  document.getElementById("detailDesc").textContent = text.detailDesc;
  document.getElementById("detailTerms").textContent = text.terms;

  const used = isCouponUsed(currentCoupon.id);
  const btn = document.getElementById("useBtn");

  if (used) {
    btn.textContent = dict.alreadyUsedBtn;
    btn.className = "btn btn-used";
    btn.disabled = true;
  } else {
    btn.textContent = dict.useBtn;
    btn.className = "btn btn-use";
    btn.disabled = false;
  }

  document.getElementById("detailModal").style.display = "flex";
}

function useCoupon() {
  if (!currentCoupon || isCouponUsed(currentCoupon.id)) return;
  const dict = t();
  const btn = document.getElementById("useBtn");

  if (!pendingUseConfirm) {
    pendingUseConfirm = true;
    btn.textContent = dict.confirmUseBtn;
    return;
  }

  pendingUseConfirm = false;
  markCouponUsed(currentCoupon.id);
  btn.textContent = dict.alreadyUsedBtn;
  btn.className = "btn btn-used";
  btn.disabled = true;
  renderCoupons();
}

function closeModal(id) {
  document.getElementById(id).style.display = "none";
}

// 端末の言語を自動判定して初期表示を反映
setLanguage(currentLang, false);
</script>
